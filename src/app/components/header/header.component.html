@if (isCompact$ | async) {
<header>
    
    <nav id="nav">
        <div routerLink="/" id="nav-logo-container">
            <img id="nav-logo" src="images/logo-fond-sombre.svg" alt="Nostanode Logo" />
        </div>
        <burger-component></burger-component>

    </nav>
</header>
} @else {
<header>
    <nav id="nav">
        <div routerLink="/" id="nav-logo-container">
            <img id="nav-logo" src="images/logo-fond-sombre.svg" alt="Nostanode Logo" />
        </div>

        <div id="nav-links">
            <ul>
                <li><a href="#">Expertises</a></li>
                <li><a href="#">Approche</a></li>
                <li>

                    <a routerLink="/contact" class="custom-button" id="nav-cta-primary">
                        Parlons de votre projet <svg lucideMoveUpRight [size]="12" color="black" [strokeWidth]="2"
                            title="Home"></svg>
                    </a>

                </li>
            </ul>
        </div>
    </nav>
</header>
}
